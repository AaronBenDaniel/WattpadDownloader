<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+Sinhala:wght@400;700&family=Noto+Sans+Thai:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <script
      defer
      src="https://stats.towu.dev/script.js"
      data-website-id="28dd7588-390c-49ed-a42c-085ad369ed93"
    ></script>

    <script>
      (function () {
        var t = localStorage.getItem("wpd-theme");
        if (!t)
          t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "abyss" : "bumblebee";
        document.documentElement.setAttribute("data-theme", t);
        var cs = t === "abyss" ? "dark" : "light";
        document.documentElement.style.colorScheme = cs;
        document.querySelector('meta[name="color-scheme"]').content = cs;
      })();
    </script>
    %sveltekit.head%
  </head>

  <body
    data-sveltekit-preload-data="hover"
    style="overflow-wrap: break-word; word-wrap: break-word"
  >
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
